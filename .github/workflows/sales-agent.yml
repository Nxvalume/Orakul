name: Fresh sales agent tests
on:
  push:
    branches:
      - fresh/nxval-sales-agent-2026
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q bot.py tests
      - run: python -m unittest discover -s tests -v
