name: MiniFish CI
on:
  push:
    branches:
      - minifish-v02
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-and-browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.2 pytest-asyncio==1.2.0
          python -m playwright install chromium --with-deps
      - name: Run MiniFish tests without production secrets
        env:
          MINIFISH_PASSWORD: test-owner-password-long
          MINIFISH_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          MINIFISH_PUBLIC_URL: https://nxval-minifish-2026.onrender.com
          BROWSER_ALLOWED_DOMAINS: example.com
        run: |
          python -m compileall -q engine.py server.py web_auth.py dashboard.py oauth_server.py live_view.py live_video.py state_store.py remote_store.py jobs.py
          python -m pytest -q tests/
