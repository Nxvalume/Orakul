name: MiniFish checks
on:
  push:
    branches: [minifish-v02]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-and-functionality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MINIFISH_PASSWORD: test-owner-password-long
      MINIFISH_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      MINIFISH_PUBLIC_URL: https://nxval-minifish-2026.onrender.com
      BROWSER_ALLOWED_DOMAINS: example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio
      - name: Install Chromium for actual browser integration test
        run: python -m playwright install --with-deps chromium
      - name: Syntax check
        run: python -m compileall -q server.py engine.py state_store.py jobs.py live_view.py dashboard.py
      - name: Unit tests
        env:
          BROWSER_ALLOWED_DOMAINS: example.com
        run: python -m pytest -q tests/
